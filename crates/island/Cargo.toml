[package]
name = "di4w-island"
description = "The island: DynamicIsland.exe"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "DynamicIsland"
path = "src/main.rs"

[dependencies]
di4w-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true
regex = "1"
# Recurring meetings in calendar feeds (RRULE), and the IANA time zones calendar feeds name.
rrule = "0.14"
chrono-tz = "0.10"
# Matrix3x2 / Vector2 as Direct2D takes them (the `windows` crate's own dependency).
windows-numerics = "0.3"
# The `#[implement]` macro (COM callbacks: UI Automation, audio notifications) refers to it by name.
windows-core = "0.62"
# WinRT collections (IIterable, IMapView) for device queries.
windows-collections = "0.3"

[build-dependencies]
embed-resource = "3"

[dependencies.windows]
workspace = true
features = [
    # WinRT
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Geolocation",
    "Media_Control",
    "Networking_Connectivity",
    "Storage_Streams",
    "System_Power",
    "UI_Notifications",
    "UI_Notifications_Management",
    # Win32
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
